<!doctype html>
<html lang="ja">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>クイズ帳 動作モック</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* ============================================================
   クイズ帳 - 動作確認用プロトタイプ（単一HTMLで完結）
   画面遷移・制限時間・採点・連続正解・時間ボーナス・ランクが実際に動く
   ============================================================ */
:root{--bg:#EEF1F8;--fg:#1E2A5A;--mute:#5b6488;--line:#d3d9ec;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141829;--fg:#e9ecf8;--mute:#a3abc9;--line:#38405f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:'Zen Maru Gothic',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 12px 48px}
.title-note{font-size:12px;color:var(--mute);text-align:center;max-width:320px;line-height:1.6}
.title-note b{color:var(--fg)}

/* phone shell */
.phone{--ink:#1E2A5A;--card:#fff;--p:#FF5A5F;--pf:#fff;--s:#FFE066;--sf:#1E2A5A;--a:#FFE066;--line2:#1E2A5A;--bd:2px;--r:6px;
  --sh:3px 3px 0 rgba(30,42,90,.55);--shs:2px 2px 0 rgba(30,42,90,.4);--ng:#3C8DFF;--c1:#FF5A5F;--c2:#3C8DFF;--c3:#2FBF71;--c4:#FFB020;
  width:300px;height:624px;background:#15141c;border-radius:38px;padding:9px;box-shadow:0 16px 34px rgba(20,30,80,.28)}
.scr{position:relative;height:100%;border-radius:30px;overflow:hidden;color:var(--ink);
  background:repeating-linear-gradient(#EAF6FF 0 23px,#9CCBEA 23px 24px);
  font-family:'Yusei Magic','Zen Maru Gothic',sans-serif;font-weight:400;font-size:13px;line-height:1.4;
  padding:12px 16px 18px;display:flex;flex-direction:column;gap:10px}
/* バッテリー0%の消灯演出（CRT風に一瞬で消える） */
#poweroff{position:absolute;inset:0;z-index:50;background:#000;opacity:0;pointer-events:none}
#poweroff.on{opacity:1;pointer-events:auto}
#poweroff.on::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:4px;border-radius:4px;
  background:#fff;box-shadow:0 0 12px 3px #fff;animation:scrOff .38s ease-out forwards}
@keyframes scrOff{
  0%{opacity:0;transform:translateY(-2px) scaleY(90)}
  12%{opacity:1;transform:scaleY(90)}
  55%{opacity:1;transform:scaleY(1) scaleX(1)}
  100%{opacity:0;transform:scaleY(1) scaleX(0)}
}
.sb{display:flex;justify-content:space-between;font:700 10px system-ui,sans-serif;opacity:.7;padding:0 4px}
.bat-wrap{display:inline-flex;align-items:center;gap:4px}
.bat{display:inline-flex;align-items:center}
.bat .cell{position:relative;width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;padding:1.5px}
.bat .cell::after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.bat .cell i{display:block;height:100%;background:currentColor;border-radius:1px}
.bat.low{color:#FF5A5F}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl{font-size:18px;line-height:1.2}
.back,.pt,.tag{background:#fff;border:var(--bd) solid var(--line2);border-radius:99px;box-shadow:var(--shs)}
.back{padding:3px 11px;font-size:11px;white-space:nowrap;cursor:pointer}
.pt{font-size:11px;background:var(--a);padding:3px 10px;box-shadow:none}
.tag{background:var(--s);padding:1px 10px;font-size:11px;box-shadow:none}
.btn{position:relative;font-size:17px;text-align:center;background:var(--p);color:var(--pf);border:var(--bd) solid var(--line2);
  border-radius:var(--r);box-shadow:var(--sh);padding:11px 8px;transform:rotate(-.8deg);cursor:pointer;user-select:none}
.btn::before{content:"";position:absolute;left:50%;top:-9px;width:46px;height:14px;background:rgba(255,224,102,.88);transform:translateX(-50%) rotate(-3deg)}
.btn.alt{background:var(--s);color:var(--sf)}.btn.alt::before,.btn.sm::before{display:none}
.btn.sm{font-size:13px;padding:9px 6px}
.btn:active{transform:rotate(-.8deg) translateY(2px);box-shadow:1px 1px 0 rgba(30,42,90,.55)}
.card2{background:#fff;border:var(--bd) solid var(--line2);border-radius:var(--r);box-shadow:var(--sh);padding:10px 12px;transform:rotate(-.6deg)}
.sub{font-size:12px;opacity:.85;text-align:center}
.foot{text-align:center;font-size:11px;opacity:.8;margin-top:8px}

/* screens toggling */
.view{display:none;flex-direction:column;gap:10px;height:100%}
.view.on{display:flex}

/* title */
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.logo small{display:inline-block;font-size:11px;background:var(--a);border:var(--bd) solid var(--line2);border-radius:99px;padding:2px 12px;margin-bottom:8px;transform:rotate(-3deg)}
.logo h1{margin:0;font-weight:400;font-size:50px;line-height:1.05;text-decoration:underline wavy #FF5A5F 3px;text-underline-offset:8px}
.q{width:92px;height:92px;display:grid;place-items:center;border-radius:50%;border:4px dashed #FF5A5F;color:#FF5A5F;font-size:62px;line-height:1}

/* category */
.cats{display:grid;gap:10px;flex:1;align-content:start;overflow:auto}
.cat{display:flex;align-items:center;gap:11px;padding:9px 11px;cursor:pointer}
.cat:nth-child(even){transform:rotate(.7deg)}
.ic{flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:22px;color:#fff;background:var(--c);border:var(--bd) solid var(--line2);border-radius:5px}
.nm{flex:1;min-width:0}.nm b{display:block;font-weight:400;font-size:16px;line-height:1.2}.nm span{font-size:10.5px;opacity:.7}
.go{font-size:17px}

/* question */
.prog{height:10px;background:#fff;border:var(--bd) solid var(--line2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--p);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.timer{display:flex;align-items:center;justify-content:space-between}
.timer b{font-size:18px}
.tbar{height:8px;background:#fff;border:var(--bd) solid var(--line2);border-radius:99px;overflow:hidden;margin-top:4px}
.tbar i{display:block;height:100%;background:var(--c3);transition:width .1s linear}
.tbar.warn i{background:#FFB020}.tbar.danger i{background:var(--p)}
.qcard{display:grid;gap:8px}
.img{height:84px;border-radius:4px;background:#FFF4C2;border:var(--bd) solid var(--line2);display:grid;place-items:center;overflow:hidden}
.img svg{width:92px;height:52px}
.qtext{font-size:14.5px;line-height:1.5}
.hint{display:grid;gap:3px;background:#FFF4C2;border:var(--bd) dashed var(--line2);border-radius:var(--r);
  padding:8px 11px;font-size:12.5px;line-height:1.5;color:var(--ink);animation:hintIn .25s ease-out}
.hint[hidden]{display:none}
.hint b{font-weight:400;font-size:12.5px}
@keyframes hintIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.chs{display:grid;gap:8px}
.ch{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:var(--bd) solid var(--line2);border-radius:var(--r);box-shadow:var(--sh);font-size:13.5px;transform:rotate(-.6deg);cursor:pointer}
.ch .l{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:var(--c);border:1.5px solid var(--line2)}
.ch:nth-child(1){--c:var(--c1)}.ch:nth-child(2){--c:var(--c2)}.ch:nth-child(3){--c:var(--c3)}.ch:nth-child(4){--c:var(--c4)}
.ch.ok{background:#DDF6E6;box-shadow:inset 0 0 0 2px #2FBF71,var(--sh)}
.ch.ng{background:#DCEBFF;box-shadow:inset 0 0 0 2px #3C8DFF,var(--sh)}
.ch[disabled]{cursor:default}
.ch .r{margin-left:auto;font-size:18px;line-height:1}

/* answer */
.verdict{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.mark{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:54px;line-height:1;color:#FF5A5F;border:6px solid #FF5A5F;transform:rotate(-6deg)}
.mark.x{color:var(--ng);border-color:var(--ng);border-radius:12px;transform:rotate(5deg)}
.verdict h3{margin:0;font-weight:400;font-size:26px;line-height:1.1;color:#FF5A5F}
.verdict h3.x{color:var(--ng)}
.ans b{display:block;font-weight:400;font-size:19px;line-height:1.3}.ans small{font-size:10.5px;opacity:.7}
.ans .you{font-size:12px;margin-top:4px;color:var(--ng)}
.exp{font-size:12px;line-height:1.6}
.combo{display:flex;align-items:center;justify-content:space-between;background:var(--a);border:var(--bd) solid var(--line2);border-radius:var(--r);box-shadow:var(--sh);padding:7px 12px;font-size:13px;transform:rotate(.6deg)}
.combo em{font-style:normal;font-size:16px}
.combo.off{background:#fff;opacity:.85}
.ans-foot{margin-top:auto}

/* result */
.score{display:grid;justify-items:center;gap:6px;text-align:center}
.big{width:120px;height:120px;display:grid;place-items:center;align-content:center;background:#FFE066;color:#FF5A5F;border:var(--bd) solid var(--line2);box-shadow:var(--sh);border-radius:50% 46% 54% 48%;transform:rotate(-4deg)}
.big i{font-style:normal;font-size:12px}.big b{font-weight:400;font-size:54px;line-height:1}.big span{font-size:12px;margin-top:-2px;color:var(--ink)}
.big.lo{background:#E3E7F3;color:#5b6488}
.rankmsg{font-size:16px;color:#FF5A5F}.rankmsg.lo{color:#5b6488}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .card2{padding:7px 4px;text-align:center}.stats span{display:block;font-size:10px;opacity:.75}.stats b{font-weight:400;font-size:17px}
.total{display:flex;justify-content:space-between;align-items:baseline}.total b{font-weight:400;font-size:26px}
.acts{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin-top:auto}

.replay{font-size:12px;color:var(--mute);text-decoration:underline;background:none;border:none;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<p class="title-note"><b>クイズ帳 動作モック</b><br>実際の遷移・20秒カウントダウン・採点・連続正解・時間ボーナス・ランク判定が動きます。カテゴリはサンプルを用意しています。</p>

<div class="phone">
  <div class="scr">
    <!-- ===== HOME ===== -->
    <div class="view on" id="v-home">
      <div class="sb"><span>9:41</span><span class="bat-wrap"></span></div>
      <div class="mid">
        <div class="logo"><small>自分で作るクイズ</small><h1>クイズ帳</h1></div>
        <div class="q">?</div>
      </div>
      <div>
        <div class="btn" onclick="go('cat')">スタート</div>
        <div class="foot">カテゴリをえらんで、クイズに挑戦しよう</div>
      </div>
    </div>

    <!-- ===== CATEGORY ===== -->
    <div class="view" id="v-cat">
      <div class="sb"><span>9:41</span><span class="bat-wrap"></span></div>
      <div class="hd"><span class="back" onclick="go('home')">‹ 戻る</span><span class="ttl">カテゴリ選択</span></div>
      <div class="sub">挑戦するカテゴリをえらぼう</div>
      <div class="cats" id="catList"></div>
    </div>

    <!-- ===== QUESTION ===== -->
    <div class="view" id="v-quiz">
      <div class="sb"><span>9:41</span><span class="bat-wrap"></span></div>
      <div class="hd">
        <span class="back" onclick="quitToTitle()">‹ タイトルへ</span>
        <span class="ttl" style="font-size:15px" id="qnum">Q1 / 5</span>
        <span class="pt" id="qscore">0pt</span>
      </div>
      <div class="prog"><i id="qprog"></i></div>
      <div class="qmeta"><span class="tag" id="qcat">カテゴリ名</span><span id="qstreak"></span></div>
      <div>
        <div class="timer"><span>⏱ のこり</span><b id="qtime">20秒</b></div>
        <div class="tbar"><i id="qtbar"></i></div>
      </div>
      <div class="card2 qcard">
        <div class="img" id="qimg"></div>
        <div class="qtext" id="qtext">問題文</div>
      </div>
      <div class="hint" id="qhint" hidden><b>💡 ヒント</b><span id="qhinttext"></span></div>
      <div class="chs" id="qchs"></div>
    </div>

    <!-- ===== ANSWER ===== -->
    <div class="view" id="v-ans">
      <div class="sb"><span>9:41</span><span class="bat-wrap"></span></div>
      <div class="hd">
        <span class="back" onclick="quitToTitle()">‹ タイトルへ</span>
        <span class="ttl" style="font-size:15px" id="anum">Q1 / 5</span>
        <span class="pt" id="ascore">0pt</span>
      </div>
      <div class="verdict" id="averdict"></div>
      <div class="card2 ans"><small>答え</small><b id="acorrect">正解</b><div class="you" id="ayou"></div></div>
      <div class="exp" id="aexp"></div>
      <div class="combo" id="acombo"></div>
      <div class="combo off" id="atime"></div>
      <div class="ans-foot"><div class="btn" id="anext"></div></div>
    </div>

    <!-- ===== RESULT ===== -->
    <div class="view" id="v-result">
      <div class="sb"><span>9:41</span><span class="bat-wrap"></span></div>
      <div class="hd"><span class="ttl">結果発表</span><span class="tag" id="rcat">カテゴリ名</span></div>
      <div class="score">
        <div class="big" id="rbig"></div>
        <div class="rankmsg" id="rmsg"></div>
      </div>
      <div class="stats">
        <div class="card2"><span>最大連続</span><b id="rstreak">0回</b></div>
        <div class="card2"><span>ボーナス</span><b id="rbonus">+0</b></div>
        <div class="card2"><span>タイム</span><b id="rtime">0:00</b></div>
      </div>
      <div class="total"><span>合計スコア</span><b id="rtotal">0pt</b></div>
      <div class="acts">
        <div class="btn alt sm" onclick="go('home')">タイトルへ</div>
        <div class="btn sm" onclick="startQuiz(state.catIndex)">もう一度</div>
      </div>
    </div>

    <!-- バッテリー0%で画面が消灯する演出 -->
    <div id="poweroff"></div>
  </div>
</div>

<button class="replay" onclick="go('home')">↺ 最初から</button>

<!-- データ本体（問題・選択肢・バッテリー残量はこのファイルを編集する） -->
<script src="quiz-data.js"></script>
<script>
/* ============================================================
   設定値（調整はここ1か所）
   ============================================================ */
var CONFIG={
  TIME_LIMIT:20,        // 1問あたりの制限時間（秒）
  TIME_COEF:0.5,        // 時間ボーナス = 残り秒数 × この係数（20秒満タンで最大+10pt）
  BASE_POINT:100,       // 正解の基礎点
  COMBO_STEP:15,        // 連続正解ボーナス = (連続数-1) × この値
  MIN_Q_FOR_RANK:5,     // これ未満の問題数ではランクを出さない
  AUTO_ADVANCE_SEC:3,   // 答え画面から次へ自動で進むまでの秒数
  RANKS:[               // 獲得スコア ÷ 理論最大スコア で判定（上から順に判定）
    {g:'S',min:0.92,c:'#FFB020'},
    {g:'A',min:0.8,c:'#FF5A5F'},
    {g:'B',min:0.6,c:'#3C8DFF'},
    {g:'C',min:0.4,c:'#2FBF71'},
    {g:'D',min:0,  c:'#7a84a8'}
  ]
};

/* 画像プレースホルダ（任意の問題用） */
var IMG='<svg viewBox="0 0 92 52"><rect width="92" height="52" fill="none"/><path d="M4 48 L30 20 L46 36 L60 22 L88 48 Z" fill="#FFD36B" stroke="#1E2A5A" stroke-width="2"/><circle cx="68" cy="14" r="7" fill="#FF5A5F" stroke="#1E2A5A" stroke-width="2"/></svg>';

/* ============================================================
   データは quiz-data.js（window.QUIZ_DATA）から読み込む。
   問題・選択肢・カテゴリの追加・編集は quiz-data.js だけ触ればよい。
   ============================================================ */
var DATA=window.QUIZ_DATA||{};
var CATEGORIES=DATA.categories||[];

/* ============================================================
   状態・ロジック
   ============================================================ */
var state={};
var timer=null;
var ansTimer=null;

function $(id){return document.getElementById(id)}
function go(v){['home','cat','quiz','ans','result'].forEach(function(n){$('v-'+n).classList.toggle('on',n===v)});
  if(v!=='ans')clearAutoAdvance(); // 答え画面を離れたら自動送りを止める
  if(v==='home'||v==='cat')stopTimer();
  if(v==='cat')renderCats();}

function renderCats(){
  if(!CATEGORIES.length){
    $('catList').innerHTML='<div class="card2" style="transform:none;text-align:center">quiz-data.js が読み込めませんでした。<br>HTMLと同じフォルダに置いてください。</div>';
    return;
  }
  $('catList').innerHTML=CATEGORIES.map(function(c,i){
    return '<div class="card2 cat" onclick="startQuiz('+i+')"><div class="ic" style="--c:'+c.color+'">'+c.icon+'</div>'+
      '<div class="nm"><b>'+c.name+'</b><span>'+c.questions.length+'問</span></div><div class="go">›</div></div>';
  }).join('');
}

function startQuiz(ci){
  var cat=CATEGORIES[ci];
  state={catIndex:ci,cat:cat,qi:0,total:cat.questions.length,correct:0,streak:0,maxStreak:0,
         score:0,bonusTotal:0,elapsed:0,timedOut:false,answered:false};
  go('quiz');
  loadQuestion();
}

function loadQuestion(){
  var q=state.cat.questions[state.qi];
  state.answered=false;state.timedOut=false;state.remaining=CONFIG.TIME_LIMIT;
  $('qnum').textContent='Q'+(state.qi+1)+' / '+state.total;
  $('anum').textContent='Q'+(state.qi+1)+' / '+state.total;
  $('qcat').textContent=state.cat.name;
  $('qscore').textContent=state.score+'pt';
  $('ascore').textContent=state.score+'pt';
  $('qstreak').textContent=state.streak>=2?(state.streak+'連続正解中'):'';
  $('qprog').style.width=Math.round(state.qi/state.total*100)+'%';
  $('qtext').textContent=q.q;
  $('qimg').style.display=q.img?'grid':'none';
  if(q.img)$('qimg').innerHTML=IMG;
  $('qchs').innerHTML=q.choices.map(function(c,i){
    return '<div class="ch" onclick="answer('+i+')"><span class="l">'+'ABCD'[i]+'</span>'+c+'<span class="r"></span></div>';
  }).join('');
  // ヒントは時間切れ(0秒)で表示。最初は隠す
  $('qhinttext').textContent=q.hint||'ヒントはありません';
  $('qhint').hidden=true;
  startTimer();
}

function startTimer(){
  stopTimer();
  var end=Date.now()+state.remaining*1000;
  updateTimer();
  timer=setInterval(function(){
    state.remaining=Math.max(0,(end-Date.now())/1000);
    updateTimer();
    if(state.remaining<=0){state.timedOut=true;stopTimer();
      if(!state.answered)$('qhint').hidden=false; // 時間切れでヒント表示
    }
  },50);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function updateTimer(){
  var r=state.remaining;
  $('qtime').textContent=Math.ceil(r)+'秒';
  var ratio=r/CONFIG.TIME_LIMIT;
  var bar=$('qtbar');bar.style.width=(ratio*100)+'%';
  var tb=bar.parentElement;tb.className='tbar'+(ratio<=0.25?' danger':ratio<=0.5?' warn':'');
}

function answer(choice){
  if(state.answered)return;
  state.answered=true;
  stopTimer();
  state.elapsed+=(CONFIG.TIME_LIMIT-state.remaining);
  var q=state.cat.questions[state.qi];
  var ok=choice===q.correct;

  // 採点
  var base=0,combo=0,timeb=0;
  if(ok){
    state.correct++;
    state.streak++;
    state.maxStreak=Math.max(state.maxStreak,state.streak);
    base=CONFIG.BASE_POINT;
    combo=Math.max(0,state.streak-1)*CONFIG.COMBO_STEP;
    // 時間ボーナス：時間切れ(0秒)なら+0。正誤判定・連続正解には不干渉
    timeb=Math.round(state.remaining*CONFIG.TIME_COEF);
  }else{
    state.streak=0;
  }
  var gained=base+combo+timeb;
  state.score+=gained;
  state.bonusTotal+=combo+timeb;

  renderAnswer(q,choice,ok,combo,timeb);
  go('ans');
}

function renderAnswer(q,choice,ok,combo,timeb){
  $('ascore').textContent=state.score+'pt';
  $('averdict').innerHTML=ok
    ?'<div class="mark">○</div><h3>せいかい!</h3>'
    :'<div class="mark x">×</div><h3 class="x">ざんねん…</h3>';
  $('acorrect').textContent=q.choices[q.correct];
  $('ayou').textContent=ok?'':'あなたの答え: '+q.choices[choice];
  $('aexp').textContent=q.exp;

  var ac=$('acombo');
  if(ok&&combo>0){ac.className='combo';ac.innerHTML='<span>'+state.streak+'連続正解ボーナス</span><span><em>+'+combo+'</em> pt</span>';ac.style.display='flex';}
  else if(!ok){ac.className='combo off';ac.innerHTML='<span>連続正解がリセットされました</span>';ac.style.display='flex';}
  else{ac.style.display='none';}

  var at=$('atime');
  if(ok){
    at.style.display='flex';
    if(timeb>0){at.style.opacity='1';at.innerHTML='<span>時間ボーナス（のこり'+Math.round(state.remaining)+'秒）</span><span><em>+'+timeb+'</em> pt</span>';}
    else{at.style.opacity='.85';at.innerHTML='<span>時間切れ：時間ボーナスなし</span><span>+0 pt</span>';}
  }else{at.style.display='none';}

  var last=state.qi>=state.total-1;
  var label=last?'結果を見る':'次の問題へ';
  var advance=last?showResult:nextQuestion;
  startAutoAdvance(label,advance);
}

/* 答え画面：3秒カウントダウンで自動送り。手動タップでも即進める */
function startAutoAdvance(label,advance){
  clearAutoAdvance();
  var n=CONFIG.AUTO_ADVANCE_SEC;
  var btn=$('anext');
  var go=function(){clearAutoAdvance();advance();};
  btn.onclick=go;
  var render=function(){btn.textContent=label+'（'+n+'）';};
  render();
  ansTimer=setInterval(function(){
    n--;
    if(n<=0){go();return;}
    render();
  },1000);
}
function clearAutoAdvance(){if(ansTimer){clearInterval(ansTimer);ansTimer=null;}}

function nextQuestion(){state.qi++;loadQuestion();go('quiz');}

/* 全問パーフェクト（全正解・時間ボーナス満タン・連続継続）の理論最大スコア */
function theoreticalMax(n){
  var maxTime=CONFIG.TIME_LIMIT*CONFIG.TIME_COEF; // 1問の時間ボーナス上限
  var sum=0;
  for(var i=1;i<=n;i++){sum+=CONFIG.BASE_POINT+maxTime+(i-1)*CONFIG.COMBO_STEP;}
  return sum;
}

function showResult(){
  var theo=theoreticalMax(state.total);
  var ratio=theo>0?state.score/theo:0;      // 獲得スコア ÷ 理論最大スコア
  var showRank=state.total>=CONFIG.MIN_Q_FOR_RANK;
  var rank=CONFIG.RANKS.find(function(r){return ratio>=r.min;});
  var big=$('rbig');
  $('rcat').textContent=state.cat.name;
  if(showRank){
    var hi=ratio>=0.6;
    big.className='big'+(hi?'':' lo');
    big.style.background=hi?'#FFE066':'';big.style.color=rank.c;
    big.innerHTML='<i>ランク</i><b>'+rank.g+'</b><span>'+state.correct+' / '+state.total+' 問せいかい</span>';
    // 次ランクまでの案内（スコア基準）
    var idx=CONFIG.RANKS.indexOf(rank);
    var msg='';
    if(idx>0){
      var up=CONFIG.RANKS[idx-1];
      var need=Math.ceil(up.min*theo)-state.score;
      if(need<1)need=1;
      msg='あと'+need+'ptで '+up.g+' ランク!';
    }else{msg='最高ランク達成！すばらしい!';}
    $('rmsg').textContent=msg;$('rmsg').className='rankmsg'+(hi?'':' lo');
  }else{
    big.className='big';big.style.background='#FFE066';big.style.color='#FF5A5F';
    big.innerHTML='<b style="font-size:40px">'+state.correct+'</b><span>/ '+state.total+' 問せいかい</span>';
    $('rmsg').textContent='5問以上でランクがつきます';$('rmsg').className='rankmsg lo';
  }
  $('rstreak').textContent=state.maxStreak+'回';
  $('rbonus').textContent='+'+state.bonusTotal;
  $('rtime').textContent=fmtTime(state.elapsed);
  $('rtotal').textContent=state.score+'pt';
  go('result');
}

function fmtTime(sec){var s=Math.round(sec);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function quitToTitle(){if(confirm('タイトルへ戻りますか？（進行中のクイズは終了します）'))go('home');}

/* ============================================================
   ステータスバーの電池アイコン（全画面共通）
   BATTERY_LEVEL（0〜100）の1変数で全画面の残量を管理する。
   BATTERY_LOW 以下で赤くなる。
   ============================================================ */
var BATTERY_LEVEL=(DATA.battery!=null)?DATA.battery:100;  // ← quiz-data.js の battery で全画面の残量を管理
var BATTERY_LOW=20;     // ← この値以下で赤くなる
function renderBatteries(){
  var lv=Math.max(0,Math.min(100,BATTERY_LEVEL));
  var low=lv<=BATTERY_LOW;
  document.querySelectorAll('.bat-wrap').forEach(function(w){
    w.innerHTML=lv+'%<span class="bat'+(low?' low':'')+'"><span class="cell"><i style="width:'+lv+'%"></i></span></span>';
  });
}
renderBatteries();

/* バッテリーが0%なら電源が切れたように画面を消す */
function checkBatteryShutoff(){
  if(Math.max(0,Math.min(100,BATTERY_LEVEL))<=0){
    stopTimer();
    $('poweroff').classList.add('on');
  }
}
checkBatteryShutoff();

renderCats();
</script>
